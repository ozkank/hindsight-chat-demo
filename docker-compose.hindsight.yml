services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight
    restart: unless-stopped
    ports:
      - "8888:8888" # API + MCP
      - "9999:9999" # Admin UI
    environment:
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: "8888"
      HINDSIGHT_API_LOG_LEVEL: info
      HINDSIGHT_ENABLE_API: "true"
      HINDSIGHT_ENABLE_CP: "true"
      HINDSIGHT_CP_DATAPLANE_API_URL: http://localhost:8888
      # Hindsight's own LLM backend (fact extraction/consolidation) — talks to the
      # same host Ollama instance the chat app uses. Keep the model name here in
      # sync with Ollama:Model in appsettings.json.
      #
      # Tried pointing this at NVIDIA NIM instead (2026-08-13): both free-tier
      # candidates failed for this specific role. meta/llama-3.1-8b-instruct
      # returned its JSON *schema* instead of extracted facts on 3/3 tries (fast,
      # but 0 facts stored, every time). nvidia/nemotron-3.5-lightning-30b-a3b
      # didn't fail outright but took 120s+ per attempt and needed retries — a
      # single retain() stalled for minutes. Reverted to Ollama here, which has
      # always worked reliably for this call. See CLAUDE.md for the full note
      # before trying this again.
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://host.docker.internal:11434/v1
      HINDSIGHT_API_LLM_MODEL: llama3.1:8b
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hindsight-data:/home/hindsight/.pg0

volumes:
  hindsight-data:
